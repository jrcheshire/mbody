[project]
name = "mbody"
version = "0.1.0"
description = "M-body: a differentiable particle-mesh N-body toy in MLX on Apple Silicon, targeting autodiff dlnP(k)/df_NL"
requires-python = ">=3.11"
authors = [{ name = "James Cheshire", email = "cheshire@caltech.edu" }]
readme = "README.md"
keywords = [
    "cosmology",
    "n-body",
    "particle-mesh",
    "differentiable",
    "autodiff",
    "mlx",
    "large-scale-structure",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "mlx",
]

[project.urls]
Homepage = "https://github.com/jrcheshire/mbody"
Repository = "https://github.com/jrcheshire/mbody"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mbody"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# MLX is Apple-Silicon only, and unified-memory autodiff on Metal is the whole
# point. Keep the platform single unless/until a CPU fallback actually matters.
platforms = ["osx-arm64"]

# Current MLX wheels target macOS 14+; the default osx-arm64 baseline (13.0) is
# too old. Raise the floor (the dev machine is macOS 26).
[tool.pixi.system-requirements]
macos = "14.0"

[tool.pixi.dependencies]
# Capped below 3.14: MLX wheels currently top out at cp313.
python = ">=3.12,<3.14"
numpy = "*"
scipy = "*"
matplotlib = "*"
pytest = "*"
black = "*"
flake8 = "*"
flake8-bugbear = "*"
camb = ">=1.6.5,<2"
pyccl = ">=3.3.4,<4"
pyarrow = ">=24.0.0,<25"

[tool.pixi.pypi-dependencies]
mbody = { path = ".", editable = true }
mlx = "*"

[tool.pixi.tasks]
test = "pytest tests/ -v"
format = "black --skip-string-normalization mbody scripts tests examples"
check-format = "black --check --skip-string-normalization mbody scripts tests examples"
lint = "flake8 mbody scripts tests examples"
probe = "python scripts/probe_ad_fft.py"
fisher = "python scripts/plot_fisher.py"
convergence = "python scripts/plot_convergence.py"
external-ccl = "python scripts/probe_external_ccl.py"
bullfrog = "python scripts/probe_bullfrog.py"
rsd = "python scripts/probe_rsd.py"
rsd-multipoles = "python scripts/plot_rsd_multipoles.py"
fisher-rsd = "python scripts/plot_fisher_rsd.py"
multitracer = "python scripts/plot_multitracer_fisher.py"
probe-multitracer = "python scripts/probe_multitracer.py"
rsd-multitracer = "python scripts/plot_rsd_multitracer.py"
probe-rsd-multitracer = "python scripts/probe_rsd_multitracer.py"
gen-mock = "python scripts/gen_mock_catalog.py"
probe-mock = "python scripts/probe_mock_validation.py"
probe-mock-fnl = "python scripts/probe_mock_fnl.py"
